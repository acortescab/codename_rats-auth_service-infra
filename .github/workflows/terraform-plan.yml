name: "Terraform PR Plan"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.10.5"
  AWS_DEFAULT_REGION: "eu-west-1"

jobs:
  validate-and-plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
      plan_summary: ${{ steps.summary.outputs.summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug OIDC
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -no-color -out=tfplan -detailed-exitcode
          plan_exit=$?
          echo "exitcode=$plan_exit" >> "$GITHUB_OUTPUT"
          if [ "$plan_exit" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Generate Plan Summary
        id: summary
        if: github.event_name == 'pull_request'
        run: |
          if [ -f tfplan ]; then
            summary=$(terraform show -no-color tfplan | grep -E "^Plan:|^No changes\." || true)
            if [ -z "$summary" ]; then
              summary="Plan completed successfully. Check logs for details."
            fi
          else
            summary="Plan file was not generated."
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Comment Plan Summary on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const summary = `${{ steps.summary.outputs.summary }}`;
            const exitCode = `${{ steps.plan.outputs.exitcode }}`;
            const status = exitCode === '0' || exitCode === '2' ? 'Success' : 'Failed';
            const output = `### Terraform Plan Summary
            **Status**: ${status}
            **Plan Exit Code**: \`${exitCode}\`
            **Plan Outcome**: ${summary}

            <details><summary>Click to view details</summary>

            Review the Terraform execution logs above to inspect the proposed changes. Merge this pull request only after the plan is accepted.
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: output
            });

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      - name: Fail job on plan errors
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

